# Machine-readable half of model.md. `explainer check {{slug}}` holds every rendering to it.
#
# values:  the facts renderings show. Any nesting; numbers and strings.
#          Scenes read them with `M = load_model(__file__)`; pages get them via `explainer sync`.
# allow:   structural numbers that are not model values (item counts, slider ends, sample sizes).
# require: values that each listed rendering must show, unless it loads the model.
# quiz:    blind understanding test. `misconception` is a wrong answer the rendering must prevent.

values:
  example_quantity: 1.0

allow: []

require: []
#  - path: example_quantity
#    in: [prose, diagram, html, video]

claims: []
#  The ideas the explanation must convey. `explainer check` requires the fields per kind and a coverage
#  mark in each rendering: <!-- claim: id --> (Markdown), data-claim="id" (HTML), self.claim("id") (scene).
#  - id: why-exp
#    kind: why                 # why | guarantee | mechanism | definition | limit | misconception
#    about: [exp]              # functions it justifies (a function in model.md with no why claim fails the check)
#    statement: "..."
#    alternative: "..."        # why: the simplest alternative
#    counterexample: "..."     # why/guarantee: the alternative or the broken assumption failing, with numbers
#    example: "..."            # guarantee/mechanism: an instance with numbers
#    ask: "..."                # optional: becomes a blind-test question
#    in: [prose, html]         # optional: default is every rendering present

accept_unjustified: {}        # e.g. {log: "..."}: a debt; `explainer check -v` lists it. Prefer a why claim.

terms: []
#  One word per concept. A rendering that uses an `avoid` phrase fails the check.
#  - term: estimate
#    means: "the shortest length found so far; 'distance' means only the final value"
#    avoid: [smallest distance, has distance]

quiz: []
#  - q: "What happens to X when Y doubles?"
#    expect: "X halves, because ..."
#    misconception: "X doubles"
