# Machine-readable half of model.md. The scene replays exactly this run.
values:
  start: A
  nodes: {A: [-5.0, 0.0], B: [-2.4, 1.9], C: [-2.4, -1.9], D: [0.6, 1.9], E: [0.6, -1.9], F: [3.2, 0.0]}
  edges: [[A, B, 4], [A, C, 2], [B, C, 1], [B, D, 5], [C, D, 8], [C, E, 10], [D, E, 2], [D, F, 6], [E, F, 3]]
  run:
    - {settle: A, at: 0, relax: [[B, 4], [C, 2]]}
    - {settle: C, at: 2, relax: [[B, 3], [D, 10], [E, 12]]}
    - {settle: B, at: 3, relax: [[D, 8]]}
    - {settle: D, at: 8, relax: [[E, 10], [F, 14]]}
    - {settle: E, at: 10, relax: [[F, 13]]}
    - {settle: F, at: 13, relax: []}
  final: {A: 0, B: 3, C: 2, D: 8, E: 10, F: 13}
  path_to_F: [A, C, B, D, E, F]
  path_length: 13
  finality_check: {settled: B, at: 3, unsettled: {D: 10, E: 12}, cheapest_other_route_at_least: 10}
  bfs_counterexample: {B_first: 4, B_true: 3, via_C: [2, 1]}
  negative_example:
    edges: [[A, B, 2], [A, C, 3], [C, B, -2]]
    dijkstra_B: 2
    via_C: 1
  complexity: "O((V + E) log V)"

require:
  - path: final
    in: [video]

accept_unjustified:
  log: "only the out-of-scope running time uses it"

terms:
  - term: estimate
    means: "the shortest length found so far; it can still drop until the node is settled. 'Distance' means only the true shortest distance, which a settled estimate equals"
    avoid: [has distance, smallest distance, shorter distance, with distance, distance zero, distance infinity, distance of infinity]

claims:
  - id: definition-relax
    kind: definition
    statement: "To relax an edge u–v: if estimate(u) + w < estimate(v), replace estimate(v) with the smaller value and record u as v's predecessor; otherwise keep estimate(v)."
  - id: why-smallest
    kind: why
    statement: "Settle the unsettled node with the smallest estimate: no other route can reach it more cheaply, because every other route passes an estimate at least as large."
    alternative: "Settle nodes in the order they are reached (breadth-first)."
    counterexample: "A reaches B with 4 and C with 2. Settling B first fixes it at 4, but A → C → B = 2 + 1 = 3."
    ask: "Why does Dijkstra settle the node with the smallest estimate, and not simply the next node it reached?"
  - id: guarantee-final
    kind: guarantee
    statement: "With lengths ≥ 0, a node's estimate is final when it is settled."
    example: "B (3) is the smallest unsettled estimate; A and C are settled. Any other path to B leaves {A, C} through D (10) or E (12), and reaching either costs at least its estimate, so the path costs at least 10 > 3."
    counterexample: "Directed A→B 2, A→C 3, C→B −2: B settles at 2, then C gives 3 − 2 = 1 < 2 after B is final."
    ask: "Show with numbers why a settled estimate cannot improve later, and give a graph where it does."
  - id: mechanism-path
    kind: mechanism
    statement: "Each node keeps the predecessor that gave its final estimate; following predecessors back from a node gives its shortest path."
    example: "From F: E, D, B, C, A. Reversed: A → C → B → D → E → F, length 2 + 1 + 5 + 2 + 3 = 13."

quiz:
  - q: "B is first reached with estimate 4. Why is its final distance 3?"
    expect: "After C is settled at 2, the path through C gives 2 + 1 = 3, which is shorter, so B's estimate is improved to 3."
    misconception: "The first path found to a node is its shortest path."
  - q: "Which node is settled after D, and why that one?"
    expect: "E, at 10: it has the smallest estimate among the unsettled nodes (E 10, F 14)."
  - q: "What assumption does the algorithm need, and what breaks without it?"
    expect: "All edge lengths are non-negative; with a negative length a settled distance can later turn out not to be the shortest."
