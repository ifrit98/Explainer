# Machine-readable half of model.md.
values:
  odd_numbers: [1, 3, 5, 7, 9]
  sums: [1, 4, 9, 16, 25]
  shown_up_to: 5
  predict: {n: 10, last_odd: 19, sum: 100}

allow: [2]        # the 2 in 2n − 1

require:
  - path: sums
    in: [video]

quiz:
  - q: "Why does adding the next odd number to a square number give the next square number?"
    expect: "The next odd number 2n − 1 is exactly one new row (n − 1), one new column (n − 1), and the corner (1): an L shape that turns the (n − 1)-square into an n-square."
  - q: "What is the sum of the first 10 odd numbers?"
    expect: "100 (10²)."
  - q: "Do the examples n = 1 to 5 prove the identity?"
    expect: "No; they show a pattern. The L-shape step proves it for every n because it does not depend on a particular n."
    misconception: "Yes, five examples are enough."
