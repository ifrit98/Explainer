# Machine-readable half of model.md.
values:
  sentences:
    - "It is imperative that the operator ensures the hydraulic reservoir is replenished prior to commencing operation."
    - "It is imperative that the operator ensures the hydraulic reservoir is full before starting operation."
    - "Make sure that the hydraulic reservoir is full before you start the operation."
    - "Fill the hydraulic reservoir before you start the machine."
  word_counts: [16, 15, 13, 9]
  rules: ["Use simple words", "Give the instruction directly", "Use concrete words"]
  style_share_percent: 80     # STE-80: about 80% of ASD-STE100

allow: [2, 3, 100]            # rule numbers 2 and 3; ASD-STE100

require:
  - path: word_counts
    in: [video]

claims:
  - id: mechanism-rules
    kind: mechanism
    statement: "Three rules take one manual sentence from 16 words to 9 without changing what the reader does."
    example: "Simple words: 16 → 15. A direct instruction: 15 → 13. Concrete words: 13 → 9."
  - id: why-concrete-verb
    kind: why
    about: []
    statement: "A concrete verb names the action, so the reader does it instead of checking a result."
    alternative: "Keep 'make sure that the hydraulic reservoir is full'."
    counterexample: "13 words, and the reader must work out the action (fill) from the result (full)."
  - id: limit-length
    kind: limit
    statement: "Fewer words is not the goal: rule one removes only one word and still helps, because each word is easier to decode."

quiz:
  - q: "Rule one removes only one word. What does it change, and why does that help?"
    expect: "It replaces formal words (replenished, prior to, commencing) with common ones (full, before, starting); each word is easier to decode. Prior to (two words) becomes before (one)."
    misconception: "Rule one is about making the sentence shorter."
  - q: "Which rule removes the most words, and what does it remove?"
    expect: "Rule three (concrete words): 'make sure that ... is full' becomes 'fill'; 13 to 9 words. (Rule two removes the frame, 15 to 13.)"
  - q: "Is a shorter sentence always better?"
    expect: "No. The target is less decoding work with the same meaning, not fewer words."
