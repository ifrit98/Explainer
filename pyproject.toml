[project]
name = "explainer"
version = "0.6.0"
description = "Explanation compiler: 3b1b-style Manim explainers with synchronized local voiceover"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kokoro-onnx>=0.5",
    "manim>=0.19",
    "manim-voiceover>=0.4",
    "pyyaml>=6",
    "soundfile>=0.13",
]

[project.urls]
Repository = "https://github.com/ifrit98/Explainer"
Documentation = "https://github.com/ifrit98/Explainer/tree/main/docs"

[project.scripts]
explainer = "explainer_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainer_kit"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
